# Every 10 minutes: launch a Cursor Cloud Agent to address unresolved Bugbot
# comments on PR #2 (branch cursor/adhd-companion-plan-0f84).
#
# Setup (once):
#   gh secret set CURSOR_API_KEY --repo wcordelo/Dayflow
#   # value from https://cursor.com/dashboard/api
#
# Note: GitHub only runs `schedule` workflows from the default branch.
# Until this file is on `main`, use workflow_dispatch here, or create the
# Cursor Automation from `.cursor/automations/bugbot-autofix-adhd-companion.md`.

name: Bugbot autofix (ADHD companion PR)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: bugbot-autofix-adhd-companion
  cancel-in-progress: false

jobs:
  launch-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require CURSOR_API_KEY
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "::error::Set repository secret CURSOR_API_KEY (Cursor Dashboard → API Keys)."
            exit 1
          fi

      - name: Skip if PR closed
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api repos/wcordelo/Dayflow/pulls/2 --jq .state)
          echo "PR #2 state=$state"
          if [ "$state" != "open" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if a bugbot agent is still running for this PR
        if: steps.pr.outputs.skip != 'true'
        id: agent_gate
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          echo "skip_agent=false" >> "$GITHUB_OUTPUT"
          PR_URL='https://github.com/wcordelo/Dayflow/pull/2'
          items=$(curl -sS -u "${CURSOR_API_KEY}:" \
            -G 'https://api.cursor.com/v1/agents' \
            --data-urlencode "prUrl=${PR_URL}" \
            --data-urlencode 'includeArchived=false' \
            --data-urlencode 'limit=100')
          export ITEMS="$items"
          python3 - <<'PY'
          import json, os, subprocess

          key = os.environ["CURSOR_API_KEY"]
          data = json.loads(os.environ["ITEMS"])
          active = {"CREATING", "RUNNING"}
          for item in data.get("items", []):
              run_id = item.get("latestRunId")
              if not run_id:
                  continue
              agent_id = item["id"]
              proc = subprocess.run(
                  [
                      "curl",
                      "-sS",
                      "-u",
                      f"{key}:",
                      f"https://api.cursor.com/v1/agents/{agent_id}/runs/{run_id}",
                  ],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              status = json.loads(proc.stdout).get("status")
              if status in active:
                  print(
                      f"::notice::Skipping launch: agent {agent_id} run {run_id} is {status}"
                  )
                  with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                      out.write("skip_agent=true\n")
                  break
          PY

      - name: Launch Cursor Cloud Agent
        if: steps.pr.outputs.skip != 'true' && steps.agent_gate.outputs.skip_agent != 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          export PROMPT_TEXT=$(cat <<'EOF'
          You run on a schedule against this repository and branch.

          Target PR: https://github.com/wcordelo/Dayflow/pull/2
          Work only on that PR's head branch: cursor/adhd-companion-plan-0f84
          Push commits to the existing branch.
          Do not open a new PR. Do not approve the PR.
          Do not mention end-user personal names in commits, comments, or docs.

          ## Goal
          Find unresolved Bugbot (cursor[bot] / Cursor Bugbot) review comments on the target PR, assess each one, and address actionable findings.

          ## Process
          1. Use `gh` and/or PR comment tools to list open (unresolved) review threads on PR #2.
          2. Filter to comments from Bugbot / cursor[bot].
          3. Skip threads already fixed, outdated, or already handled.
          4. For each actionable finding (prefer High severity; max 3 per run): assess, minimal fix, test if feasible, commit, push, reply on the thread, resolve if done.
          5. If unclear: reply explaining why — do not guess.
          6. If none remain: do nothing.

          ## Rules
          Only change code required by the Bugbot comments. No drive-by refactors.
          EOF
          )

          body=$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            "prompt": {"text": os.environ["PROMPT_TEXT"]},
            "name": "Bugbot autofix — ADHD companion PR",
            "repos": [{
              "url": "https://github.com/wcordelo/Dayflow",
              "prUrl": "https://github.com/wcordelo/Dayflow/pull/2"
            }],
            "workOnCurrentBranch": True,
            "autoCreatePR": False
          }))
          PY
          )

          resp=$(curl -sS -u "${CURSOR_API_KEY}:" \
            -H 'Content-Type: application/json' \
            -X POST 'https://api.cursor.com/v1/agents' \
            -d "$body")
          echo "$resp" | python3 -m json.tool || echo "$resp"
          echo "$resp" | python3 -c 'import json,sys; d=json.load(sys.stdin); a=d.get("agent") or d; assert a.get("id"), d; print("agent_url=", a.get("url","")); print("agent_id=", a.get("id",""))'
