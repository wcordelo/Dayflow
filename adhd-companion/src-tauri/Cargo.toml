[package]
name = "adhd-companion"
version = "0.1.0"
description = "ADHD nudge companion for macOS (Tauri v2)"
authors = ["ADHD Companion contributors"]
edition = "2021"
default-run = "adhd-companion"

[lib]
name = "adhd_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "adhd-companion"
path = "src/main.rs"

[[bin]]
name = "e2e_harness"
path = "src/bin/e2e_harness.rs"

[features]
default = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
dirs = "6"
base64 = "0.22"
ureq = { version = "2.12", features = ["json"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
